<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Background: deep indigo → near-black -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#08091a"/>
    </linearGradient>
    <!-- Bars: white → soft indigo-white -->
    <linearGradient id="bar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <!-- Subtle glow behind center bar -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background with macOS-style rounded corners -->
  <rect width="1024" height="1024" rx="230" ry="230" fill="url(#bg)"/>

  <!-- Centre glow -->
  <ellipse cx="512" cy="512" rx="230" ry="380" fill="url(#glow)"/>

  <!--
    5 pill-shaped bars, bell-curve heights, centred on 512,512
    Bar width: 100 px   Gap: 50 px   Total span: 700 px   Start x: 162
    Heights:  280  420  600  420  280
  -->
  <rect x="162" y="372" width="100" height="280" rx="50" ry="50" fill="url(#bar)" opacity="0.60"/>
  <rect x="312" y="302" width="100" height="420" rx="50" ry="50" fill="url(#bar)" opacity="0.80"/>
  <rect x="462" y="212" width="100" height="600" rx="50" ry="50" fill="url(#bar)"/>
  <rect x="612" y="302" width="100" height="420" rx="50" ry="50" fill="url(#bar)" opacity="0.80"/>
  <rect x="762" y="372" width="100" height="280" rx="50" ry="50" fill="url(#bar)" opacity="0.60"/>
</svg>
